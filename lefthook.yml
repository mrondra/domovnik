rc: .lefthookrc

pre-commit:
  parallel: true
  commands:
    eslint:
      glob: '{packages,apps}/**/*.{ts,tsx,js,cjs,mjs}'
      run: pnpm eslint --max-warnings=0 {staged_files}
    prettier:
      glob: '*.{ts,tsx,js,cjs,mjs,json,yml,yaml,md}'
      run: pnpm prettier --check {staged_files}
    gitleaks:
      run: gitleaks protect --staged --no-banner
commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
pre-push:
  commands:
    verify:
      # `verify:fast` = všechno kromě integration testů. Ty potřebují
      # testcontainers, jsou nejpomalejší a občas spadnou na timeoutu
      # portů, aniž by se čehokoli týkaly. CI (.github/workflows/verify.yml)
      # pouští plné `pnpm verify` na push i pull_request proti postgresu
      # jako službě, takže se integration vrstva stejně ověří — jen
      # spolehlivěji a bez osmiminutové daně na každý push.
      run: pnpm verify:fast
