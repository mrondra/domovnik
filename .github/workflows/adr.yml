# ADR se statusem `Proposed` je návrh, který agent rozhodl a člověk ještě
# nepotvrdil. Potvrzením je merge do `main` — ten je vědomý akt, a ADR, které
# nechceš přijmout, prostě nezamerguješ.
#
# Bez tohohle by se návrhy hromadily: agenti se na ADR odvolávají při
# rozhodování, takže `Proposed` ADR ovlivňuje jejich práci, i když ho nikdo
# neodsouhlasil. Zamčení statusem `Accepted` navíc podle AGENTS.md §7 znamená,
# že do něj agent smí dopsat už jen `Superseded by`.
name: adr

on:
  push:
    branches: [main]
    paths: ['docs/adr/**']

permissions:
  contents: write

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Potřeba předchozí commit, aby šlo zjistit, co v tomhle pushi přibylo.
          fetch-depth: 2

      - name: přepnout Proposed na Accepted
        run: |
          set -euo pipefail
          changed=$(git diff --name-only --diff-filter=AM HEAD^ HEAD -- 'docs/adr/*.md' || true)
          [ -n "$changed" ] || { echo 'žádné ADR v tomhle pushi'; exit 0; }

          flipped=""
          for f in $changed; do
            # Jen přesný řádek statusu a jen Proposed. Nic jiného v souboru.
            if grep -qx -- '- Status: Proposed' "$f"; then
              sed -i 's|^- Status: Proposed$|- Status: Accepted|' "$f"
              flipped="$flipped $f"
              echo "  ✓ $f"
            fi
          done
          [ -n "$flipped" ] || { echo 'nic ve stavu Proposed'; exit 0; }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $flipped
          # [skip ci] jinak by push na main spustil verify i e2e kvůli jednomu řádku
          git commit -m "docs(adr): prijato mergem do main [skip ci]

Prepnuto automaticky: merge do main je potvrzeni navrhu (AGENTS.md §6)."
  git push
