# ADR se statusem `Proposed` je návrh, který agent rozhodl a člověk ještě
# nepotvrdil. Potvrzením je merge do `main` — ten je vědomý akt, a ADR, které
# nechceš přijmout, prostě nezamerguješ.
#
# Bez tohohle by se návrhy hromadily: agenti se na ADR odvolávají při
# rozhodování, takže `Proposed` ADR ovlivňuje jejich práci, i když ho nikdo
# neodsouhlasil. Zamčení statusem `Accepted` podle AGENTS.md §7 znamená, že do
# něj agent smí dopsat už jen `Superseded by`.
name: adr

on:
  push:
    branches: [main]
    paths: ['docs/adr/**']

permissions:
  contents: write

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Potřeba předchozí commit, aby šlo zjistit, co v tomhle pushi přibylo.
          fetch-depth: 2

      - name: prepnout proposed na accepted
        env:
          # Hláška commitu jde přes proměnnou, ne přes víceřádkový řetězec v YAML:
          # prettier takový řetězec přeformátuje a odsazení se rozjede tak, že
          # GitHub workflow vůbec nepřečte (stalo se 2026-09-28).
          BODY: 'Prepnuto automaticky: merge do main je potvrzeni navrhu (AGENTS.md §6).'
        run: |
          set -euo pipefail
          changed=$(git diff --name-only --diff-filter=AM HEAD^ HEAD -- 'docs/adr/*.md' || true)
          if [ -z "$changed" ]; then echo 'zadne ADR v tomhle pushi'; exit 0; fi

          flipped=""
          for f in $changed; do
            if grep -qx -- '- Status: Proposed' "$f"; then
              sed -i 's|^- Status: Proposed$|- Status: Accepted|' "$f"
              flipped="$flipped $f"
              echo "prepnuto: $f"
            fi
          done
          if [ -z "$flipped" ]; then echo 'nic ve stavu Proposed'; exit 0; fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $flipped
          git commit -m 'docs(adr): prijato mergem do main [skip ci]' -m "$BODY"
          git push
