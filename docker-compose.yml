services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: domovnik
      POSTGRES_PASSWORD: domovnik
      POSTGRES_DB: domovnik
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-app-role.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U domovnik']
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    # Chainguard, protože MinIO své vlastní obrazy stáhlo: `docker pull minio/minio` odpoví
    # „repository does not exist" a quay.io 401 — na každý tag i na digest toho, který jsme měli
    # připnutý. Na stroji s obrazem v cache to není vidět, čerstvý klon a CI nerozjedou nic.
    #
    # Tag je `latest` schválně, i když to jde proti pravidlu připínat: free tier nic jiného
    # nevydává a starý digest do pár týdnů zmizí, takže by pin shnil rychleji, než se tag hne.
    # Kupujeme si za to obraz, který někdo pořád záplatuje. Stejný obraz drží i testcontainer
    # v packages/kernel/src/testing/storage.ts.
    image: cgr.dev/chainguard/minio:latest
    # Konzole tu není mapovaná: z komunitního MinIA ji vyhodili, port by jen mátl.
    ports:
      - '9000:9000'
    environment:
      MINIO_ROOT_USER: domovnik
      MINIO_ROOT_PASSWORD: domovnik123
    volumes:
      - miniodata:/data
    command: ['server', '/data']
    # Healthcheck tu chybí zámyslem: v obrazu není curl, wget ani nc, takže by ho neměl čím
    # udělat. Pořadí řeší minio-init níž svou restart policy.

  minio-init:
    # `mc` od stejného vydavatele. Obraz je distroless — žádný shell, takže žádné
    # `mc alias set … && mc mb`: přihlášení nese MC_HOST_<alias> a čekání na server řeší
    # restart policy, ne smyčka v shellu.
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://domovnik:domovnik123@minio:9000
    command: ['mb', '--ignore-existing', 'local/domovnik']
    restart: on-failure

  langfuse-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U langfuse']
      interval: 5s
      timeout: 3s
      retries: 5

  langfuse:
    image: langfuse/langfuse:2
    ports:
      - '3100:3000'
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3100
      NEXTAUTH_SECRET: dev-secret-change-me
      SALT: dev-salt-change-me
      TELEMETRY_ENABLED: 'false'
      HOSTNAME: '0.0.0.0'
    depends_on:
      langfuse-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://localhost:3000/api/public/health\").then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  miniodata:
  langfuse_pgdata:
